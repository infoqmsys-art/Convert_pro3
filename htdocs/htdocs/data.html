<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 데이터 로딩</title>
    <script>
        function fetchData() {
            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'block'; // 로딩 텍스트 보이기

            // AJAX 요청
            fetch('http://qmhttp.iptime.org/cat/save_data.py') // 데이터 요청할 URL
                .then(response => response.json())
                .then(data => {
                    // 데이터 처리 및 표시
                    document.getElementById('data').innerText = JSON.stringify(data, null, 2);
                    loadingText.style.display = 'none'; // 로딩 텍스트 숨기기
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    loadingText.innerText = '데이터를 가져오는 데 오류가 발생했습니다.';
                });
        }

        // 주기적으로 데이터 요청
        setInterval(fetchData, 5000); // 5초마다 fetchData 호출
    </script>
</head>
<body>
    <h1>실시간 데이터</h1>
    <div id="loading" style="display:none;">로딩 중...</div> <!-- 로딩 중 표시 -->
    <pre id="data"></pre> <!-- 데이터 표시 -->
</body>
</html>
