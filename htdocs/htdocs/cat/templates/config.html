<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // 설정을 가져와서 폼에 표시
        async function fetchConfig() {
            const response = await fetch("/api/config");
            const config = await response.json();

            // 각 필드의 값을 설정
            document.getElementById("nid-value").value = config.nid || "";
            document.getElementById("sendPeriod-value").value = config.sendPeriod || "";
            document.getElementById("reset-value").value = config.reset || "";
        }

        // 업데이트 버튼 클릭 시 설정 값을 서버에 저장
        async function updateConfig() {
            const nid = document.getElementById("nid-value").value;
            const sendPeriod = document.getElementById("sendPeriod-value").value;
            const reset = document.getElementById("reset-value").value;

            const response = await fetch("/api/config", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nid, sendPeriod, reset })  // 단순한 JSON 형식으로 보냄
            });

            if (response.ok) {
                alert("Configuration updated successfully!");
                fetchConfig();
            } else {
                const error = await response.json();
                alert("Error: " + (error.error || "Failed to update configuration"));
            }
        }

        // 초기화 버튼 클릭 시 설정 값을 기본값으로 초기화
        async function resetConfig() {
            const response = await fetch("/api/config/reset", { method: "POST" });
            if (response.ok) {
                alert("Configuration reset successfully!");
                fetchConfig();
            }
        }

        document.addEventListener("DOMContentLoaded", fetchConfig);
    </script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Config Management</h1>

        <div class="mb-3">
            <label for="nid-value" class="form-label">NID (Enter a number):</label>
            <input type="text" class="form-control" id="nid-value">
        </div>

        <div class="mb-3">
            <label for="sendPeriod-value" class="form-label">Send Period (Enter a number):</label>
            <input type="text" class="form-control" id="sendPeriod-value">
        </div>

        <div class="mb-3">
            <label for="reset-value" class="form-label">Reset (Enter a number):</label>
            <input type="text" class="form-control" id="reset-value">
        </div>

        <button class="btn btn-primary w-100" onclick="updateConfig()">Update Config</button>
        <button class="btn btn-danger w-100 mt-2" onclick="resetConfig()">Reset Config</button>
    </div>
</body>
</html>
