<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 데이터 확인</title>
    <script>
        function fetchData() {
            fetch('http://qmhttp.iptime.org/cat/get_data.py')
                .then(response => response.json())
                .then(data => {
                    // 받은 데이터 처리
                    document.getElementById('dataDisplay').innerText = JSON.stringify(data, null, 2);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // 5초마다 데이터 가져오기
        setInterval(fetchData, 5000);
    </script>
</head>
<body>
    <h1>실시간 데이터 확인</h1>
    <pre id="dataDisplay">데이터를 로드 중입니다...</pre>
</body>
</html>
