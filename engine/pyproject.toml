[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-engine"
version = "0.1.0"
description = "Logger CSV conversion engine (UI-free core from Convert Pro 3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.scripts]
convert-engine = "convert_engine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["convert_engine*"]
